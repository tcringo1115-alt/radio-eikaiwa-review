  <style>
    :root {
      --primary: #27634e;
      --primary-hover: #1e4d3c;
      --bg: #f5f3ed;
      --card-bg: #ffffff;
      --text: #26352f;
      --muted: #718078;
      --border: #e5e5dd;
      --accent: #d9534f;
      --accent-bg: #fdf2f2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 16px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: var(--bg); }
    .wrap { max-width: 760px; margin: auto; padding: 20px 18px 60px; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand {
      font-weight: 750;
      color: var(--primary);
      font-size: 20px;
      text-decoration: none;
      display: inline-block;
    }
    .brand small {
      display: block;
      color: var(--muted);
      font-weight: 500;
      font-size: 11px;
      letter-spacing: .1em;
    }
    .header-btns {
      display: flex;
      gap: 8px;
    }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(39, 69, 51, 0.05);
    }
    .muted { color: var(--muted); }
    .eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin: 0 0 6px; }
    .title { font-size: 26px; line-height: 1.3; margin: 6px 0 16px; }
    
    .search, textarea, select {
      width: 100%;
      border: 1px solid #d9ded8;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
      color: inherit;
    }
    .search:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(39, 99, 78, 0.15);
    }
    .search { margin: 14px 0; }
    
    .mode-bar {
      display: flex;
      background: #e9ece6;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 10px 14px;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s ease;
    }
    .mode-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    
    .lesson-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
    }
    .lesson {
      padding: 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: left;
      color: inherit;
      font: inherit;
      cursor: pointer;
      transition: border-color .15s ease, transform .1s ease;
    }
    .lesson:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .lesson b { display: block; font-size: 15px; color: var(--text); }
    .lesson small { display: block; color: var(--muted); margin-top: 6px; font-size: 12px; }
    
    .button {
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background-color .15s ease, opacity .15s ease;
    }
    .button:active { opacity: 0.85; }
    .primary { background: var(--primary); color: #fff; }
    .primary:hover { background: var(--primary-hover); }
    .secondary { background: #edf1ec; color: #294239; }
    .secondary:hover { background: #e2e8e0; }
    .danger { background: var(--accent-bg); color: var(--accent); }
    .full { width: 100%; margin-top: 12px; }
    .icon-btn {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
    }
    .icon-btn:hover { background: #f0f3ee; }
    
    .prompt-box {
      margin: 24px 0 28px;
    }
    .prompt {
      font-size: clamp(22px, 5.5vw, 30px);
      line-height: 1.5;
      font-weight: 700;
      margin: 8px 0;
    }
    
    .answer-box {
      margin-top: 20px;
      padding: 20px;
      background: #f3f6f1;
      border-radius: 16px;
      border: 1px solid #e1e8df;
    }
    .answer-text {
      font-size: clamp(20px, 5vw, 24px);
      line-height: 1.5;
      color: #1a4234;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .speech-btn {
      background: #fff;
      border: 1px solid #c7d4c5;
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .speech-btn:hover { background: #eef4ed; }
    
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .back {
      border: 0;
      background: none;
      color: var(--primary);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .back:hover { text-decoration: underline; }
    .small { font-size: 13px; color: var(--muted); }
    textarea { min-height: 200px; line-height: 1.6; font-family: monospace; font-size: 13px; }
    .notice {
      background: #fff8e8;
      border: 1px solid #fae2ad;
      color: #7d5a11;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      margin: 12px 0;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      background: #e2ede7;
      color: var(--primary);
    }
    .badge-data {
      background: #d8ecdf;
      color: #1b5e3a;
      border: 1px solid #a8d5b8;
    }
    .count { font-size: 13px; color: var(--muted); }
    
    @media (max-width: 520px) {
      .wrap { padding: 14px 12px 40px; }
      .card { padding: 18px 16px; border-radius: 18px; }
      .lesson-list { grid-template-columns: 1fr; }
      .title { font-size: 22px; }
      .prompt { font-size: 20px; }
      .answer-text { font-size: 18px; }
    }
  </style>

  <script>
  (() => {
    'use strict';

    // ==========================================
    // 1. カタログ読み込み（Lesson 1〜155、5の倍数は除外）
    // ==========================================
    const rawCatalog = JSON.parse(document.querySelector('#catalog').textContent || '[]');
    // Review回（5の倍数）を自動除外
    const catalog = rawCatalog.filter(item => item.lesson % 5 !== 0);

    // ==========================================
    // 2. フォールバック用 DEFAULT_DIALOGS (Lesson 1〜4)
    // ==========================================
    const DEFAULT_DIALOGS = [
      // Lesson 1
      { lesson: 1, id: "L01-01", ja: "やあ、調子はどう？", en: "Hi. How's it going?" },
      { lesson: 1, id: "L01-02", ja: "とても順調よ、ありがとう。", en: "Pretty good, thanks." },
      { lesson: 1, id: "L01-03", ja: "リー教授のレポート、もう終わらせた？", en: "Did you already finish the report for Professor Lee?" },
      { lesson: 1, id: "L01-04", ja: "うん、昨日の夜遅くに提出したよ。出典をすべて記載するのにものすごく時間がかかったわ。", en: "Yeah, I submitted it late last night. It took me forever to cite all the sources." },
      { lesson: 1, id: "L01-05", ja: "うらやましいな。僕はまだ半分しか終わってないよ。ケーススタディーにあんなに時間がかかるとは思わなかった。", en: "Lucky you. I'm still halfway through. I didn't realize how long the case study would take." },
      { lesson: 1, id: "L01-06", ja: "急いだほうがいいよ。締め切りは今日の午後3時だよね？", en: "You'd better hurry. The deadline is three p.m. today, right?" },
      { lesson: 1, id: "L01-07", ja: "分かってるよ。それまで図書館にこもることになりそうだな。", en: "I know. Guess I'll be living in the library until then." },
      { lesson: 1, id: "L01-08", ja: "何か食べるのも忘れないでね！", en: "Don't forget to eat something too!" }
    ];

    // ==========================================
    // 3. データ管理と初期化 (dialogs.js & localStorage)
    // ==========================================
    const STORAGE_KEY_CUSTOM = 'gemini_dialogs_custom_v2';
    const STORAGE_KEY_RATINGS = 'gemini_dialogs_ratings_v2';
    const STORAGE_KEY_MODE = 'gemini_dialogs_mode_v2';

    // 確実に EXTERNAL_DIALOGS を取得（window / globalThis / スコープ変数すべてチェック）
    let externalData = null;
    try {
      if (typeof window !== 'undefined' && Array.isArray(window.EXTERNAL_DIALOGS) && window.EXTERNAL_DIALOGS.length > 0) {
        externalData = window.EXTERNAL_DIALOGS;
      } else if (typeof globalThis !== 'undefined' && Array.isArray(globalThis.EXTERNAL_DIALOGS) && globalThis.EXTERNAL_DIALOGS.length > 0) {
        externalData = globalThis.EXTERNAL_DIALOGS;
      } else if (typeof EXTERNAL_DIALOGS !== 'undefined' && Array.isArray(EXTERNAL_DIALOGS) && EXTERNAL_DIALOGS.length > 0) {
        externalData = EXTERNAL_DIALOGS;
      }
    } catch (e) {
      console.warn('EXTERNAL_DIALOGS access check:', e);
    }

    const hasExternal = (externalData !== null && externalData.length > 0);
    const baseDialogs = hasExternal ? externalData : DEFAULT_DIALOGS;

    function getCustomDialogs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_CUSTOM) || '{}');
      } catch {
        return {};
      }
    }

    function saveCustomDialogs(data) {
      localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(data));
    }

    function getRatings() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_RATINGS) || '{}');
      } catch {
        return {};
      }
    }

    function saveRatings(data) {
      localStorage.setItem(STORAGE_KEY_RATINGS, JSON.stringify(data));
    }

    function getMode() {
      return localStorage.getItem(STORAGE_KEY_MODE) || 'random'; // 'random' or 'weak'
    }

    function saveMode(mode) {
      localStorage.setItem(STORAGE_KEY_MODE, mode);
    }

    // 指定レッスンの全ダイアログを取得
    function getDialogsForLesson(lessonNum) {
      if (lessonNum % 5 === 0) return []; // Review回は除外
      const custom = getCustomDialogs()[lessonNum];
      if (Array.isArray(custom) && custom.length > 0) {
        return custom;
      }
      return baseDialogs.filter(d => d.lesson === lessonNum);
    }

    // 全レッスンのダイアログ一覧を取得
    function getAllAvailableDialogs() {
      const all = [];
      const custom = getCustomDialogs();
      for (let l = 1; l <= 155; l++) {
        if (l % 5 === 0) continue;
        if (Array.isArray(custom[l]) && custom[l].length > 0) {
          all.push(...custom[l]);
        } else {
          all.push(...baseDialogs.filter(d => d.lesson === l));
        }
      }
      return all;
    }

    // ==========================================
    // 4. Web Speech API (音声再生)
    // ==========================================
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'en-US';
      ut.rate = 0.95;
      window.speechSynthesis.speak(ut);
    }

    // ==========================================
    // 5. アプリケーションステート & 画面描画
    // ==========================================
    const screen = document.querySelector('#screen');
    let currentLesson = null;
    let deck = [];
    let currentCard = null;
    let isRevealed = false;
    let searchQuery = '';
    let currentMode = getMode();

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function pickNextCard(first = false) {
      if (!deck.length) {
        currentCard = null;
        return;
      }
      if (deck.length === 1) {
        currentCard = deck[0];
        isRevealed = false;
        return;
      }

      const ratings = getRatings();

      if (currentMode === 'weak') {
        const weighted = [];
        deck.forEach(c => {
          const id = c.id || `${c.lesson}-${c.ja}`;
          const r = ratings[id] || { good: 0, again: 0 };
          let weight = Math.max(1, (r.again * 3) + (r.good === 0 && r.again === 0 ? 2 : 0) - r.good);
          for (let i = 0; i < weight; i++) {
            weighted.push(c);
          }
        });

        let nextCandidate = weighted[Math.floor(Math.random() * weighted.length)];
        if (nextCandidate === currentCard && deck.length > 1 && !first) {
          const filtered = weighted.filter(c => c !== currentCard);
          if (filtered.length) {
            nextCandidate = filtered[Math.floor(Math.random() * filtered.length)];
          }
        }
        currentCard = nextCandidate;
      } else {
        let nextCandidate = deck[Math.floor(Math.random() * deck.length)];
        if (nextCandidate === currentCard && deck.length > 1 && !first) {
          const pool = deck.filter(c => c !== currentCard);
          nextCandidate = pool[Math.floor(Math.random() * pool.length)];
        }
        currentCard = nextCandidate;
      }

      isRevealed = false;
    }

    // ------------------------------------------
    // 画面: レッスン一覧 (Home)
    // ------------------------------------------
    function renderHome() {
      const allCards = getAllAvailableDialogs();
      const filtered = catalog.filter(l => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return `${l.lesson} ${l.theme}`.toLowerCase().includes(q);
      });

      const totalGood = Object.values(getRatings()).reduce((acc, r) => acc + (r.good || 0), 0);
      const totalAgain = Object.values(getRatings()).reduce((acc, r) => acc + (r.again || 0), 0);

      // 収録レッスン数を計算
      const activeLessonsCount = catalog.filter(l => getDialogsForLesson(l.lesson).length > 0).length;

      screen.innerHTML = `
        <div class="mode-bar">
          <button class="mode-btn ${currentMode === 'random' ? 'active' : ''}" id="modeRandom">🎲 全問ランダム</button>
          <button class="mode-btn ${currentMode === 'weak' ? 'active' : ''}" id="modeWeak">🔥 できなかった優先</button>
        </div>

        <div class="card" style="margin-bottom: 24px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <p class="eyebrow">PRACTICE OVERVIEW</p>
            <span class="badge ${hasExternal ? 'badge-data' : ''}">
              ${hasExternal ? `✓ dialogs.js 読み込み成功 (${allCards.length}問)` : `⚠️ DEFAULT_DIALOGS 使用中 (${allCards.length}問)`}
            </span>
          </div>
          <h1 class="title">今日の一問を始める</h1>
          <p class="muted">日本語を見て頭の中で英作文。現在 <strong>${activeLessonsCount} レッスン・全 ${allCards.length} 問</strong> が復習可能です。</p>
          
          <button class="button primary full" id="startAllBtn" style="font-size:17px;padding:16px;">
            全レッスン (${allCards.length}問) からランダム出題 →
          </button>
          
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid #f0f0ea;">
            <span class="count">習得: <strong>${totalGood}</strong> 回 · 復習中: <strong>${totalAgain}</strong> 回</span>
            <span class="small">収録: ${activeLessonsCount} / ${catalog.length} レッスン</span>
          </div>
        </div>

        <p class="eyebrow">LESSON LIBRARY</p>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <h2 style="font-size:20px;margin:0;">Lessonを選んで復習</h2>
          <span class="count">${filtered.length} レッスン表示</span>
        </div>
        
        <input class="search" id="searchInput" placeholder="Lesson番号やテーマ（あいさつ、依頼など）で検索" value="${esc(searchQuery)}">

        <div class="lesson-list">
          ${filtered.map(l => {
            const count = getDialogsForLesson(l.lesson).length;
            return `
              <button class="lesson" data-lesson="${l.lesson}">
                <b>Lesson ${String(l.lesson).padStart(3, '0')} · ${esc(l.theme)}</b>
                <small style="${count > 0 ? 'color:var(--primary);font-weight:600;' : ''}">
                  ${count > 0 ? `✓ ${count}文収録` : '未登録（追加可能）'}
                </small>
              </button>
            `;
          }).join('')}
        </div>
      `;

      document.querySelector('#modeRandom').onclick = () => {
        currentMode = 'random';
        saveMode('random');
        renderHome();
      };
      document.querySelector('#modeWeak').onclick = () => {
        currentMode = 'weak';
        saveMode('weak');
        renderHome();
      };

      document.querySelector('#startAllBtn').onclick = () => {
        currentLesson = null;
        deck = allCards;
        if (!deck.length) {
          alert('出題できるダイアログがありません。');
          return;
        }
        pickNextCard(true);
        renderPractice();
      };

      const searchInput = document.querySelector('#searchInput');
      searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        const pos = e.target.selectionStart;
        renderHome();
        const s = document.querySelector('#searchInput');
        if (s) {
          s.focus();
          s.setSelectionRange(pos, pos);
        }
      };

      document.querySelectorAll('[data-lesson]').forEach(btn => {
        btn.onclick = () => {
          const lNum = parseInt(btn.dataset.lesson, 10);
          const lObj = catalog.find(x => x.lesson === lNum);
          const cards = getDialogsForLesson(lNum);
          if (!cards.length) {
            renderEdit(lObj);
            return;
          }
          currentLesson = lObj;
          deck = cards;
          pickNextCard(true);
          renderPractice();
        };
      });
    }

    // ------------------------------------------
    // 画面: 練習画面 (Practice)
    // ------------------------------------------
    function renderPractice() {
      if (!currentCard) {
        renderHome();
        return;
      }

      const lNum = currentCard.lesson;
      const lObj = catalog.find(x => x.lesson === lNum) || { lesson: lNum, theme: '復習' };
      const cardId = currentCard.id || `${lNum}-${currentCard.ja}`;
      const ratings = getRatings();
      const currentRating = ratings[cardId] || { good: 0, again: 0 };

      screen.innerHTML = `
        <div class="topline">
          <button class="back" id="backBtn">← 一覧に戻る</button>
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="badge ${currentMode === 'weak' ? 'danger' : ''}">
              ${currentMode === 'weak' ? '🔥 できなかった優先' : '🎲 全問ランダム'}
            </span>
            <span class="count">${currentLesson ? `Lesson ${lNum} · 全${deck.length}文` : `全レッスン横断 (${deck.length}問)`}</span>
          </div>
        </div>

        <article class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <p class="eyebrow">Lesson ${String(lNum).padStart(3, '0')} · ${esc(lObj.theme)}</p>
            ${currentCard.id ? `<span class="badge">${esc(currentCard.id)}</span>` : ''}
          </div>

          <div class="prompt-box">
            <p class="muted" style="margin:0 0 6px;font-size:13px;">この日本語を英語で言ってみましょう：</p>
            <div class="prompt">${esc(currentCard.ja)}</div>
          </div>

          ${isRevealed ? `
            <div class="answer-box">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <span class="eyebrow" style="color:var(--primary);">模範解答</span>
                <button class="speech-btn" id="speakBtn">🔊 音声を再生</button>
              </div>
              <div class="answer-text" lang="en">${esc(currentCard.en)}</div>
            </div>

            <p class="muted" style="text-align:center;font-size:13px;margin:20px 0 10px;">自分の解答と比べてどうでしたか？</p>
            <div class="row">
              <button class="button secondary" id="againBtn" style="color:#c53030;">できなかった</button>
              <button class="button primary" id="goodBtn">できた！</button>
            </div>
          ` : `
            <button class="button primary full" id="revealBtn" style="font-size:17px;padding:16px;">答えを見る</button>
          `}

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid #f0f0ea;">
            <span class="small">この文の成績: できた ${currentRating.good} / もう一度 ${currentRating.again}</span>
            <button class="back" id="editThisLessonBtn" style="font-size:13px;">このLessonの文を編集</button>
          </div>
        </article>
      `;

      document.querySelector('#backBtn').onclick = () => renderHome();
      document.querySelector('#editThisLessonBtn').onclick = () => renderEdit(lObj);

      if (!isRevealed) {
        document.querySelector('#revealBtn').onclick = () => {
          isRevealed = true;
          renderPractice();
          speak(currentCard.en);
        };
      } else {
        document.querySelector('#speakBtn').onclick = () => speak(currentCard.en);
        
        document.querySelector('#goodBtn').onclick = () => {
          const r = getRatings();
          r[cardId] = r[cardId] || { good: 0, again: 0 };
          r[cardId].good++;
          saveRatings(r);
          pickNextCard();
          renderPractice();
        };

        document.querySelector('#againBtn').onclick = () => {
          const r = getRatings();
          r[cardId] = r[cardId] || { good: 0, again: 0 };
          r[cardId].again++;
          saveRatings(r);
          pickNextCard();
          renderPractice();
        };
      }
    }

    // ------------------------------------------
    // 画面: レッスン文の編集・追加 (Edit)
    // ------------------------------------------
    function renderEdit(lObj) {
      const lNum = lObj.lesson;
      const currentList = getDialogsForLesson(lNum);
      const textVal = currentList.map(item => `${item.ja} | ${item.en}`).join('\n');

      screen.innerHTML = `
        <div class="topline">
          <button class="back" id="backFromEdit">← 戻る</button>
          <span class="count">Lesson ${lNum} 編集</span>
        </div>

        <article class="card">
          <p class="eyebrow">CUSTOM DIALOG TEXT</p>
          <h1 class="title">Lesson ${lNum} の文を登録・編集</h1>
          <p class="muted">${esc(lObj.theme)}</p>
          <p class="muted" style="font-size:14px;">1行につき「日本語 | English」の形式で入力してください。</p>

          <div class="notice">
            例：<br>
            やあ、調子はどう？ | Hi. How's it going?<br>
            とても順調よ、ありがとう。 | Pretty good, thanks.
          </div>

          <textarea id="editInput" placeholder="日本語 | English">${esc(textVal)}</textarea>

          <button class="button primary full" id="saveEditBtn">保存して復習を始める</button>
          <button class="button secondary full" id="resetEditBtn" style="margin-top:8px;">デフォルトに戻す</button>
        </article>
      `;

      document.querySelector('#backFromEdit').onclick = () => renderHome();

      document.querySelector('#saveEditBtn').onclick = () => {
        const lines = document.querySelector('#editInput').value.split('\n');
        const parsed = [];
        let seq = 1;
        lines.forEach(line => {
          const trimmed = line.trim();
          if (!trimmed) return;
          const sep = trimmed.indexOf('|');
          if (sep > -1) {
            const ja = trimmed.slice(0, sep).trim();
            const en = trimmed.slice(sep + 1).trim();
            if (ja && en) {
              parsed.push({
                lesson: lNum,
                id: `L${String(lNum).padStart(2, '0')}-${String(seq++).padStart(2, '0')}`,
                ja,
                en
              });
            }
          }
        });

        const custom = getCustomDialogs();
        custom[lNum] = parsed;
        saveCustomDialogs(custom);

        currentLesson = lObj;
        deck = parsed.length ? parsed : getDialogsForLesson(lNum);
        if (deck.length) {
          pickNextCard(true);
          renderPractice();
        } else {
          renderHome();
        }
      };

      document.querySelector('#resetEditBtn').onclick = () => {
        if (confirm('このLessonのカスタム登録を削除し、初期状態（dialogs.js または DEFAULT_DIALOGS）に戻しますか？')) {
          const custom = getCustomDialogs();
          delete custom[lNum];
          saveCustomDialogs(custom);
          renderHome();
        }
      };
    }

    // ------------------------------------------
    // 画面: データ管理（インポート／エクスポート）
    // ------------------------------------------
    function renderDataManagement() {
      screen.innerHTML = `
        <div class="topline">
          <button class="back" id="backFromData">← ホームに戻る</button>
          <span class="count">データ管理</span>
        </div>

        <article class="card">
          <p class="eyebrow">STORAGE &amp; BACKUP</p>
          <h1 class="title">データの管理</h1>
          <p class="muted">登録文や学習履歴は、お使いのブラウザーの localStorage に安全に保存されています。</p>

          <div style="margin:24px 0;padding:16px;background:#f9fbf8;border:1px solid #e2e8df;border-radius:14px;">
            <h3 style="font-size:16px;margin:0 0 8px;">データのエクスポート</h3>
            <p class="small" style="margin-bottom:12px;">現在のすべての登録ダイアログ（カスタム追加分を含む）をJSONファイルとして保存します。</p>
            <button class="button secondary" id="exportBtn">📥 ダイアログをJSON出力</button>
          </div>

          <div style="margin:24px 0;padding:16px;background:#f9fbf8;border:1px solid #e2e8df;border-radius:14px;">
            <h3 style="font-size:16px;margin:0 0 8px;">データのインポート</h3>
            <p class="small" style="margin-bottom:12px;">以前エクスポートしたJSONファイル、または外部ダイアログJSONを読み込みます。</p>
            <input type="file" id="importFile" accept=".json" style="margin-bottom:8px;">
          </div>

          <div style="margin:24px 0;padding:16px;background:#fff5f5;border:1px solid #fed7d7;border-radius:14px;">
            <h3 style="font-size:16px;margin:0 0 8px;color:#c53030;">学習履歴のリセット</h3>
            <p class="small" style="margin-bottom:12px;">「できた／できなかった」の成績カウントをリセットします。（登録文は削除されません）</p>
            <button class="button danger" id="resetRatingsBtn">学習履歴をクリア</button>
          </div>
        </article>
      `;

      document.querySelector('#backFromData').onclick = () => renderHome();

      document.querySelector('#exportBtn').onclick = () => {
        const all = getAllAvailableDialogs();
        const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dialogs_backup_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      document.querySelector('#importFile').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (!Array.isArray(data)) {
              alert('JSON形式が不正です。配列データである必要があります。');
              return;
            }
            const custom = getCustomDialogs();
            let count = 0;
            data.forEach(item => {
              if (item.lesson && item.ja && item.en && item.lesson % 5 !== 0) {
                if (!custom[item.lesson]) custom[item.lesson] = [];
                custom[item.lesson].push(item);
                count++;
              }
            });
            saveCustomDialogs(custom);
            alert(`${count} 件のダイアログをインポートしました！`);
            renderHome();
          } catch (err) {
            alert('ファイルの読み込みに失敗しました: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      document.querySelector('#resetRatingsBtn').onclick = () => {
        if (confirm('すべての学習履歴（できた／できなかったのカウント）を消去しますか？')) {
          localStorage.removeItem(STORAGE_KEY_RATINGS);
          alert('学習履歴をリセットしました。');
          renderDataManagement();
        }
      };
    }

    document.querySelector('#importExportBtn').onclick = () => renderDataManagement();

    window.addEventListener('hashchange', () => {
      if (location.hash === '#home' || !location.hash) {
        renderHome();
      }
    });

    renderHome();
  })();
  </script>
</body>
</html>
